model_list:
  # GLM-5 via ZhipuAI
  - model_name: glm-5
    litellm_params:
      model: zhipuai/glm-5
      api_key: os.environ/ZHIPUAI_API_KEY
      supports_anthropic_messages: false

  # GPT-5.4 via OpenAI
  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY
      supports_anthropic_messages: false

  # Gemini 3.1 Pro — supports OpenAI format, Anthropic format, and Gemini native
  - model_name: gemini-3.1-pro
    litellm_params:
      model: gemini/gemini-3.1-pro
      api_key: os.environ/GEMINI_API_KEY
      supports_anthropic_messages: true   # Litellm converts Anthropic → Gemini

  # Gemini 3 Flash — supports all three formats
  - model_name: gemini-3-flash
    litellm_params:
      model: gemini/gemini-3.0-flash
      api_key: os.environ/GEMINI_API_KEY
      supports_anthropic_messages: true

litellm_settings:
  drop_params: true
  set_verbose: false
  json_logs: false
  request_timeout: 120
  num_retries: 2
  retry_after: 3

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  proxy_batch_write_at: 5

# Key rotation for Bank of AI — handled by external pool service
# LiteLLM receives the pooled api_key via litellm_params: { api_key }
